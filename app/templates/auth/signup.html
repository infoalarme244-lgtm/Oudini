{% extends "base.html" %}{% block bare %}<div class="auth card"><h1>Créer un compte</h1>
{% if error %}<div class="alert bad">{{ error }}</div>{% endif %}
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label for="name">Nom</label><input id="name" name="name" autocomplete="name">
<label for="email">Email</label><input id="email" name="email" type="email" required value="{{ email or '' }}" autocomplete="email">
<label for="pw">Mot de passe (10 caractères min.)</label><input id="pw" name="password" type="password" required minlength="10" autocomplete="new-password">
<p><button class="btn primary">Créer mon compte</button></p></form><p class="small">Déjà inscrit ? <a href="/login">Connexion</a></p></div>{% endblock %}
