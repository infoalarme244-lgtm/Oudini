{% extends "base.html" %}{% block bare %}<div class="auth card"><h1>Connexion</h1>
{% if error %}<div class="alert bad">{{ error }}</div>{% endif %}
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label for="email">Email</label><input id="email" name="email" type="email" required value="{{ email or '' }}" autocomplete="email">
<label for="pw">Mot de passe</label><input id="pw" name="password" type="password" required autocomplete="current-password">
<p><button class="btn primary">Se connecter</button></p></form><p class="small"><a href="/signup">Créer un compte</a></p></div>{% endblock %}
