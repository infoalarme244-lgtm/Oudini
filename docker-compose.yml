# Production minimale : PostgreSQL + application + worker + Caddy (HTTPS Let's Encrypt automatique).
# 1) cp .env.example .env  et remplir   2) docker compose up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: shopforge
      POSTGRES_USER: shopforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopforge"]
      interval: 10s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://shopforge:${POSTGRES_PASSWORD}@db:5432/shopforge
      SHOPFORGE_ENV: prod
    volumes: [media:/app/media]   # photos téléversées (à sauvegarder aussi)
    depends_on:
      db: {condition: service_healthy}

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://shopforge:${POSTGRES_PASSWORD}@db:5432/shopforge
      SHOPFORGE_ENV: prod
    command: ["python", "-m", "app.worker"]
    depends_on:
      db: {condition: service_healthy}

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?définir DOMAIN dans .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]

  backup:
    image: postgres:16
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes: [./backups:/backups]
    # sauvegarde quotidienne, conservation 14 jours (à copier aussi hors du serveur)
    entrypoint: ["sh", "-c", "while true; do pg_dump -h db -U shopforge -Fc shopforge > /backups/shopforge-$$(date +%F).dump && find /backups -name '*.dump' -mtime +14 -delete; sleep 86400; done"]
    depends_on:
      db: {condition: service_healthy}

volumes:
  media:
  pgdata:
  caddy_data:
